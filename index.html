<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alfakma Jaya</title>
  <link rel="icon" href="/res/new_alfakma.webp"/>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6376694717788933" crossorigin="anonymous"></script>
  <link href="style.css" rel="stylesheet">
  <style>
    .intro {
      padding-top: 40px;
      margin: 5px;
      font-family:'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
      font-size: 1.5rem;
      font-weight: 450;
      margin-bottom: 30px;
      color: #ff3d3d;
    }
    .characters {
      font-family: bfdi;
      display: flex;
      justify-content: center;
      gap: 21px;
      flex-wrap: wrap;
      margin-top: 15px;
    }
    .charactersI {
      display: inline-block;
      background: #fff;
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.1);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      text-decoration: none;
    }
    .charactersI:hover {
      transform: scale(1.05);
      transition: transform 0.2s ease;
    }
    .char {
      text-align: center;
    }
    .namechar {
      margin-top: 5px;
      font-family: bfdi;
      color: #333;
      font-size: 1.1rem;
      text-decoration: none;
    }
    .banner {
      width: 100%;
      height: 400px;
      background-image: url('/res/banner.webp');
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center;
      display: block;
    }
    .news {
      font-size: 1.3rem;
      margin: 15px 20px;
      color: #492121;
      border: none;
    }
    .socialmedia {
      display: grid;
      grid-template-columns: 1fr;
      gap: 25px;
      width: 80%;
      max-width: 700px;
      margin: 0 auto;
      justify-items: center;
    }
    .socialI {
      display: flex;
      align-items: center;
      gap: 7px;
      width: 100%;
      max-width: 600px;
      background: #fff;
      border-radius: 12px;
      padding: 7px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.1);
      text-decoration: none;
      color: #333;
    }
    .socialI:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    }
    .namesocial {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 600;
    }
    .diskusi {
      margin: 30px auto;
      width: 90%;
      max-width: 700px;
    }
    .socialmedia a {
      text-decoration: none;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .socialmedia a:hover {
      transform: scale(1.03);
      opacity: 0.8;
    }
    .socialmedia img {
      width: 50px;
      height: 50px;
      object-fit: contain;
    }
    .newvideos {
      width: 640px;
      height: 360px;
      border-radius: 12px;
      margin-top: 15px;
    }
    .d2048 {
      display: grid;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 12px;
      background: #fff;
      border-radius: 12px;
      padding: 30px 5px;
      font-family: Helvetica, sans-serif;
      font-size: 2.5rem;
      color: #ff6a6a;
      box-shadow: 0 3px 8px rgba(0,0,0,0.1);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      text-decoration: none;
      max-width: 320px;
      margin: 0 auto;
    }
    .d2048:hover {
      transform: scale(1.03);
      opacity: 0.8;
    }
    .d2048 span {
      font-size: 0.9rem;
      color: #aa2222;
      font-family: bfdi;
      font-weight: 400;
    }
    @media (max-width: 600px) {
      .intro {
        font-size: 1.15rem;
        padding-top: 27px;
      }
      .newvideos {
        width: 90%;
        max-width: 560px;
        height: width * 0.5625; /* Maintain 16:9 aspect ratio */
        height: auto;
      }
      .banner {
        height: 180px; 
        background-position: center top;
      }
      .mygames {
        grid-template-columns: 1fr;
      }
      .game {
        align-items: center;
        width: 80%;
      }
      .game img {
        width: 120px;
        height: 90px;
      }
      .namegame {
        font-size: 1rem;
      }
      .releasedate {
        font-size: 0.75rem;
      }
      .news {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo">
      <img class="icon" src="/res/new_alfakma.webp" alt="Logo">
      <p>Alfakma Jaya</p>
    </div>
    <div class="menu-toggle" id="menu-toggle">
      <div></div>
      <div></div>
    </div>
    <div class="nav-links" id="nav-links">
      <a href="/">Home</a>
      <a href="games/">Games</a>
    </div>
  </nav>
  <main class="hero" id="home">
    <div class="banner"></div>
    <div class="intro">Welcome to official Alfakma Website. I made many fun projects and games here</div>
      <p class="info">Call me Alfakma, or my real name is Akma.</p>
      <br>
    <a href="games/2048/" class="d2048">2048<span>NEW GAME IS OUT!!!</span></a>
    <div class="subtitle">Social media</div>
      <div class="socialmedia" id="socialmedia"></div>
    <div class="subtitle">My Favorite BFDI Characters</div>
      <div class="characters" id="characters"></div>
    <div class="title">New Video</div>
      <iframe
        id="latestVideo"
        title="YouTube video player"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        class="newvideos"
        allowfullscreen>
      </iframe>
    <div class="title">News 📰</div>
      <p class="news" id="news">
    <div class="title" id="comments">Comments</div>
    <div class="diskusi" id="disqus_thread"></div>
    <script>
        (function() {
        var d = document, s = d.createElement('script');
        s.src = 'https://alfakmaofficial.disqus.com/embed.js';
        s.setAttribute('data-timestamp', +new Date());
        (d.head || d.body).appendChild(s);
        })();
    </script>
    <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
  <div class="subtitle" id="ambatukam">Audio memes</div>
    <audio controls>
      <source src="res/audio/ambatukam-harmony.mp3" type="audio/mpeg">
      Ambatukam!
    </audio>
    <audio controls>
      <source src="res/audio/metal-pipe.mp3" type="audio/mpeg">
      Metal Pipe!
    </audio>
  </main>
  <div class="credit">
    <p>©Alfakma 2023-2026</p>
    <a href="feedback/index.html" class="downnav">Feedback</a>
    <a href="https://www.youtube.com/@alfakmajaya" class="downnav">Youtube</a>
  </div>
</body>
<script src="nav.js"></script>
<script>
  fetch("latestvideo.json")
  .then(response => response.json())
  .then(data => {
    document.getElementById("latestVideo").src = data.latestVideo;
  });

  const newsContent = [
    { title: "10 August, 2026 - 2048!", content: "2048. My favorite game is playable in my own website!" },
    { title: "25 June, 2026 - Revamped!", content: "Erm, yes. I've finally revamped some of my elements in my website. Also i moved the games section into it's own page " },
    { title: "16 May, 2026 - FINALLY!", content: "FINALLY I UPDATED MY WEBSITE! Also i added so you can play Test Your Math REMASTERED in website..." },
    { title: "11 November, 2025 - Audio memes and More games!", content: "Added Audio memes for <i>idk</i> (just random features). Also, i've added more games, including my FIRST GAME EVER!!" },
    { title: "10 November, 2025 - Comments!", content: "Now you can leave comments on my website using my Disqus. Share your thoughts and feedback! Don't forget to log-in first." },
    { title: "10 November, 2025 - Design Overhaul", content: "Yes! I have updated the website to much cooler and mobile friendly!" },
    { title: "9 November, 2025 - YAY, My own website!", content: "I made my own website! This website is for see new information and news from my games. I hope you like it!" }
  ];
    
const container = document.getElementById("news");
  newsContent.forEach(n => {
    const details = document.createElement("details");
    details.className = "news";
    details.innerHTML = `
      <summary>${n.title}</summary>
      <p>${n.content}</p>
    `;
    container.appendChild(details);
  });

  const chars = [
    { name: "#1 Pen", namelink: "Pen", src: "res/penjaya.webp" },
    { name: "#2 Marker", namelink: "Marker", src: "res/markery.webp"},
    { name: "#3 Coiny", namelink: "Coiny", src: "res/coinyepic.webp" },
    { name: "#4 Fries", namelink: "Fries", src: "res/friesjaya.webp"},
    { name: "#5 Pencil", namelink: "Pencil", src: "res/penicillin.webp"},
    { name: "#6 Nickel", namelink: "Nickel", src: "res/nickel.webp"}
  ];

  const charsContainer = document.getElementById("characters");
    chars.forEach(c => {
      const div = document.createElement("div");
      div.className = "char";
      div.innerHTML = `
      <a class="charactersI" style="text-decoration: none" href="https://battlefordreamisland.fandom.com/wiki/${c.namelink}" target="_blank">
        <img src="${c.src}" alt="${c.name}" width="120" height="120">
        <p class="namechar">${c.name}</p>
      </a>
      `;
      charsContainer.appendChild(div);
    });

  const socials = [
    { name: "YouTube (@alfakmajaya)", src: "res/youtube.png", link: "https://www.youtube.com/@alfakmajaya" },
    { name: "Scratch (azkaakma2)", src: "res/scratch.webp", link: "https://scratch.mit.edu/users/azkaakma2/" },
    { name: "Penguinmod (alfakma17)", src: "res/penguinmod.webp", link: "https://penguinmod.com/profile?user=alfakma17" },
    { name: "Roblox (@azkaakma2)", src: "res/roblox.webp", link: "https://www.roblox.com/users/314058527/profile"},
    { name: "Gamebanana (Alfakma)", src: "res/gamebanana.png", link: "https://gamebanana.com/members/4895173" },
    { name: "GameJolt (@AlfakmaGames)", src: "res/gamejolt.png", link: "https://gamejolt.com/@AlfakmaGames"},
    { name: "Itch.io (AlfakmaGames)", src: "res/itch-io.png", link: "https://alfakmagames.itch.io/" },
    { name: "GitHub (Alfakma17)", src: "res/github.png", link: "https://github.com/Alfakma17" },
    { name: "Cocrea (@Alfakma17)", src: "res/cocrea.png", link: "https://www.cocrea.world/@Alfakma17" }
  ];
  const socialContainer = document.getElementById("socialmedia");
  socials.forEach(s => {
    const a = document.createElement("a");

    a.href = s.link;
    a.target = "_blank";
    a.className = "socialI";

    a.innerHTML = `
      <img src="${s.src}" alt="${s.name}">
      <p class="namesocial">${s.name}</p>
    `;

    socialContainer.appendChild(a);
  });
</script>
</html>
